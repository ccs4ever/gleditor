# Project Xanadu ZigZag Sample Slice
#
# A "Slice" is one YAML file following the zzstructure schema below --
# a multi-dimensional cell space (zzcells).
#
# Links only need to be declared from ONE side: giving a cell a `pos`
# neighbor on a dimension automatically derives a matching `neg` back.
# `d.1: 2` is shorthand for `d.1: { pos: 2 }`.

zzstructure:
  meta:
    name: "Xanadu ZigZag Sample Outline"
    description: "A document outline demonstrating chapter sequencing, per-chapter detail branches, and cross references."
    version: "1.0"
    author: "Project Xanadu ZigZag Team"
    created: "2026-08-30"
    tags: [sample, outline, documentation, zigzag]

  focus: 1

  view:
    x_dimension: d.1
    y_dimension: d.2
    z_dimension: d.3

  dimensions:
    d.1:
      label: "Sequence"
      description: "Chapter-to-chapter reading order"
      color: "#e35b5b"
      spacing: 2.4
    d.2:
      label: "Detail"
      description: "Each chapter's elaboration / subtopic branch"
      color: "#59c178"
      spacing: 1.8
    d.3:
      label: "Reference"
      description: "Cross-references between detail cells"
      color: "#4f9de0"
      spacing: 2.0

  scene:
    background_color: "#0d0d12"
    focus_color: "#f4c542"
    focus_scale: 1.4
    cell_radius: 0.35

  cells:
    - id: 1
      text: "Introduction"
      type: chapter
      dimensions: { d.1: 2, d.2: 9 }

    - id: 2
      text: "Chapter 1: Origins"
      type: chapter
      dimensions: { d.1: 3, d.2: 5 }

    - id: 3
      text: "Chapter 2: Structure"
      type: chapter
      dimensions: { d.1: 4, d.2: 7 }

    - id: 4
      text: "Chapter 3: Applications"
      type: chapter
      dimensions: { d.2: 8 }

    - id: 5
      text: "1.1 Ted Nelson"
      type: detail
      dimensions: { d.2: 6, d.3: 7 }

    - id: 6
      text: "1.2 Project Xanadu"
      type: detail
      dimensions: { d.3: 8, d.preflet: 10 }

    - id: 7
      text: "2.1 Cells and Links"
      type: detail

    - id: 8
      text: "3.1 Hypertext"
      type: detail

    - id: 9
      text: "Revision Note"
      type: note

    # --- Preflet chain for cell 6 ---
    - id: 10
      type: preflet_resource
      text: "magnet:?xt=urn:btih:f4a1c9d2e6b73058a1c4f9e2d7b3a68051c2e9f4&dn=xanadu-companion-slice"
      dimensions: { d.preflet: 11 }

    - id: 11
      type: preflet_version
      text: "2.1"
      dimensions: { d.preflet: 12 }

    - id: 12
      type: preflet_meta
      text: "file: companion_slice.yaml"
      dimensions: { d.preflet: 13 }

    - id: 13
      type: preflet_meta
      text: "note: demonstration link"
