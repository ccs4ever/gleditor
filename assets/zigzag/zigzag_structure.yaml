# Project Xanadu ZigZag Sample Slice
#
# A "Slice" is one YAML file following the zzstructure schema below --
# a multi-dimensional cell space (zzcells).
#
# Links only need to be declared from ONE side: giving a cell a `pos`
# neighbor on a dimension automatically derives a matching `neg` back.
# `d.1: 2` is shorthand for `d.1: { pos: 2 }`.

zzstructure:
  meta:
    name: "Xanadu ZigZag Sample Outline"
    description: "A document outline demonstrating chapter sequencing, per-chapter detail branches, and cross references."
    version: "1.0"
    author: "Project Xanadu ZigZag Team"
    created: "2026-08-30"
    tags: [sample, outline, documentation, zigzag]

  focus: 1

  view:
    x_dimension: d.1
    y_dimension: d.2
    z_dimension: d.3

  dimensions:
    d.1:
      label: "Sequence"
      description: "Chapter-to-chapter reading order"
      color: "#e35b5b"
      spacing: 2.4
    d.2:
      label: "Detail"
      description: "Each chapter's elaboration / subtopic branch"
      color: "#59c178"
      spacing: 1.8
    d.3:
      label: "Reference"
      description: "Cross-references between detail cells"
      color: "#4f9de0"
      spacing: 2.0
    d.schema:
      label: "Schema"
      description: "Document schema specification and structure definitions"
      color: "#f5a623"
      spacing: 2.0
    d.notes:
      label: "Notes"
      description: "User annotations and customization notes"
      color: "#9b51e0"
      spacing: 2.0

  scene:
    background_color: "#0d0d12"
    focus_color: "#f4c542"
    focus_scale: 1.4
    cell_radius: 0.35

  cells:
    - id: 1
      text: "Introduction"
      role: chapter
      dimensions: { d.1: 2, d.2: 9, d.schema: 100, d.notes: 200 }

    - id: 2
      text: "Chapter 1: Origins"
      role: chapter
      dimensions: { d.1: 3, d.2: 5 }

    - id: 3
      text: "Chapter 2: Structure"
      role: chapter
      dimensions: { d.1: 4, d.2: 7 }

    - id: 4
      text: "Chapter 3: Applications"
      role: chapter
      dimensions: { d.2: 8 }

    - id: 5
      text: "1.1 Ted Nelson"
      role: detail
      dimensions: { d.2: 6, d.3: 7 }

    - id: 6
      text: "1.2 Project Xanadu"
      role: detail
      dimensions: { d.3: 8 }

    - id: 7
      text: "2.1 Cells and Links"
      role: detail

    - id: 8
      text: "3.1 Hypertext"
      role: detail

    - id: 9
      text: "Revision Note"
      role: note

    - id: 100
      role: schema_doc
      text: "Schema and Purpose\n\nOutline Structure Slice\nPurpose:\nOrganizes document chapters into sequential reading order (d.1) and topical elaboration branches (d.2)."

    - id: 200
      role: user_notes
      text: "Notes\n\nUser Document Notes:\nOutline drafted for Project Xanadu ZigZag demonstration."
