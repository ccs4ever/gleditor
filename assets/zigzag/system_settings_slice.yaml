zzstructure:
  meta:
    name: "ZigZag System Settings Slice"
    description: "Sovereign runtime parameters for Project Xanadu ZigZag multi-dimensional cell visualization."
    version: "1.0"
    author: "Project Xanadu ZigZag System"
    created: "2026-09-06"
    tags: [system, settings, configuration, zigzag]

  focus: 1

  view:
    x_dimension: d.config
    y_dimension: d.schema
    z_dimension: d.notes

  dimensions:
    d.config:
      label: "Configuration"
      description: "Runtime settings and visualizer parameters"
      color: "#4f9de0"
      spacing: 2.5
    d.schema:
      label: "Schema"
      description: "Specification of configuration cell purpose, schema, and units"
      color: "#f5a623"
      spacing: 2.2
    d.notes:
      label: "Notes"
      description: "User annotations and customization notes"
      color: "#9b51e0"
      spacing: 2.2

  scene:
    background_color: "#0d0d12"
    focus_color: "#f4c542"
    focus_scale: 1.4
    cell_radius: 0.35

  cells:
    - id: 1
      text: "Scene Settings"
      type: config_group
      dimensions: { d.config: 2, d.schema: 100, d.notes: 200 }

    - id: 2
      text: "background_color: #0d0d12"
      type: setting
      dimensions: { d.config: 3, d.schema: 101, d.notes: 201 }

    - id: 3
      text: "focus_color: #f4c542"
      type: setting
      dimensions: { d.config: 4, d.schema: 102 }

    - id: 4
      text: "focus_scale: 1.4"
      type: setting
      dimensions: { d.config: 5, d.schema: 103 }

    - id: 5
      text: "cell_radius: 0.35"
      type: setting
      dimensions: { d.schema: 104 }

    - id: 100
      text: "Schema and Purpose\n\nZigZag System Settings Slice\nPurpose:\nManages global viewport rendering, scene background, cursor focus highlighting, and spatial cell geometry in Project Xanadu ZigZag."
      type: schema_doc

    - id: 101
      text: "Schema: background_color\nHex RGB color string defining the visualizer space clearing color. Default is #0d0d12."
      type: schema_field

    - id: 102
      text: "Schema: focus_color\nHex RGB color string for the active focus cell cursor ring. Default is #f4c542."
      type: schema_field

    - id: 103
      text: "Schema: focus_scale\nMagnification multiplier applied to the focused cell geometry. Default is 1.4."
      type: schema_field

    - id: 104
      text: "Schema: cell_radius\nCorner rounding radius for 3D cell boxes in spatial units. Default is 0.35."
      type: schema_field

    - id: 200
      text: "Notes\n\nUser Configuration and Display Calibration Notes:\nReserved for user notes, customized color schemes, and visual preferences."
      type: user_notes

    - id: 201
      text: "Notes: Theme Customization\nDark background reduces visual strain during extended hypergrid navigation."
      type: user_notes
