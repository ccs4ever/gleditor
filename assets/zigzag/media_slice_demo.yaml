# Project Xanadu ZigZag Media Slice Demo
# Demonstrates multi-dimensional space connecting text, images, and rich media cells.

zzstructure:
  meta:
    name: "Rich Media & Xanadu Visual Archive"
    description: "Multidimensional ZigZag slice with image and rich media cells"
    version: "1.0"
    author: "Project Xanadu Team"
    created: "2026-08-30"
    tags: [media, images, zigzag, xanadu]

  focus: 1

  view:
    x_dimension: d.1
    y_dimension: d.2
    z_dimension: d.media

  dimensions:
    d.1:
      label: "Chronology"
      description: "Timeline sequence across items"
      color: "#e35b5b"
      spacing: 2.4
    d.2:
      label: "Hierarchy"
      description: "Section breakdown and details"
      color: "#59c178"
      spacing: 2.0
    d.media:
      label: "Media Illustration"
      description: "Parallel visual dimension linking text to media cells"
      color: "#f4a261"
      spacing: 2.2

  scene:
    background_color: "#0d0d12"
    focus_color: "#f4c542"
    focus_scale: 1.4
    cell_radius: 0.35

  cells:
    - id: 1
      text: "Hypertext Architecture"
      type: chapter
      dimensions: { d.1: 2, d.media: 10 }

    - id: 2
      text: "Two-Way Linking"
      type: chapter
      dimensions: { d.1: 3, d.media: 20 }

    - id: 3
      text: "Transclusion Engine"
      type: chapter
      dimensions: { d.media: 30 }

    # Media cells along d.media
    - id: 10
      text: "Architecture Diagram"
      type: image
      mime_type: "image/png"
      media_path: "assets/textures/architecture.png"
      dimensions: { d.1: 20 }

    - id: 20
      text: "Linking Schematic"
      type: image
      mime_type: "image/png"
      media_path: "assets/textures/two_way_link.png"
      dimensions: { d.1: 30 }

    - id: 30
      text: "Transclusion Spec"
      type: image
      mime_type: "image/png"
      media_path: "assets/textures/transclusion.png"
