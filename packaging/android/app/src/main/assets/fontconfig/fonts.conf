<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Android ships fonts but no fontconfig of its own: font selection there
  goes through a different, Java-side API this program does not use. Pango
  still needs fontconfig to find anything, so this points it at the one
  directory of real font files every Android build has (/system/fonts) and
  restates, as generic aliases, the handful of mappings a desktop fontconfig
  install would otherwise supply from /etc/fonts/conf.d, enough to resolve
  this program's own default font, "Monospace 16" (see src/app.cpp).

  @@CACHE_DIR@@ is substituted by android_bootstrap.cpp with a path under the
  app's own internal storage before this is written out: fontconfig's default
  cache location is not one Android lets an app write to.
-->
<fontconfig>
  <dir>/system/fonts</dir>
  <cachedir>@@CACHE_DIR@@</cachedir>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Roboto Mono</family>
      <family>Droid Sans Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>Monospace</family>
    <prefer>
      <family>Roboto Mono</family>
      <family>Droid Sans Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Droid Serif</family>
    </prefer>
  </alias>
</fontconfig>
