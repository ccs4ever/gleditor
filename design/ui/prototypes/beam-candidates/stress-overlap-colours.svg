<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Five overlapping link identities</title><desc id="desc">Five same-span links preserve separate authors, types, IDs and full endset counts in a named chooser. The passage uses one readable selected-range treatment rather than five blended highlight fills. Selected Carl link 203 has independent left and right cursors. Color is only a secondary type cue.</desc><g font-family="sans-serif"><rect x="0" y="0" width="1400" height="1000" fill="#0b111b" stroke="none" stroke-width="1" rx="0"/><text x="35" y="42" font-size="29" fill="#e1eaf0" font-weight="600">Five overlapping identities: one readable passage, honest overflow</text><text x="35" y="73" font-size="18" fill="#acbdcd" font-weight="400">Five links cover the same exact words. Selected-range evidence stays clear; no mixed rainbow fill.</text><text x="35" y="104" font-size="14" fill="#96b4c9" font-weight="600">DESIGN MOCKUP · NOT APP RENDER · Proposed behavior; native acceptance not established</text><rect x="35" y="150" width="915" height="406" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="35" y="150" width="915" height="36" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="50" y="175" font-size="17" fill="#d5e0e9" font-weight="400">Source page · same short span belongs to five different links</text><text x="69" y="235" font-size="22" fill="#20313c" font-weight="400">This paragraph discusses the architecture of reference.</text><text x="69" y="284" font-size="22" fill="#20313c" font-weight="400">The author asks readers to</text><rect x="354" y="263" width="344" height="32" fill="#ebe3f3" stroke="#745099" stroke-width="1.5" rx="0"/><text x="364" y="287" font-size="22" fill="#20313c" font-weight="600">keep the original context</text><text x="69" y="334" font-size="22" fill="#20313c" font-weight="400">while forming their own response.</text><text x="69" y="419" font-size="18" fill="#52616e" font-weight="400">The source words remain readable; one selected range is shown.</text><text x="69" y="455" font-size="17" fill="#52616e" font-weight="400">Other relation identities are disclosed by the named list, not blended into ink.</text><path d="M930 265H937V298H930" fill="none" stroke="#745099" stroke-width="2" opacity="1" stroke-linejoin="round"/><rect x="881" y="301" width="44" height="26" fill="#452a60" stroke="#b98cff" stroke-width="1" rx="5"/><text x="887" y="320" font-size="14" fill="#e1eaf0" font-weight="600">03</text><rect x="966" y="337" width="108" height="73" fill="#1c293a" stroke="#719caf" stroke-width="1" rx="6"/><text x="979" y="367" font-size="19" fill="#e1eaf0" font-weight="600">5 links</text><text x="979" y="393" font-size="17" fill="#acbdcd" font-weight="400">Choose…</text><path d="M950 282H1008" fill="none" stroke="#b98cff" stroke-width="3.2" opacity="1" stroke-linejoin="round"/><path d="M1008 274V290M1015 274V290" fill="none" stroke="#b98cff" stroke-width="1.6" opacity="1" stroke-linejoin="round"/><text x="968" y="240" font-size="16" fill="#acbdcd" font-weight="400">Right 2 outside view · local continuation</text><rect x="1130" y="359" width="236" height="100" fill="#1c293a" stroke="#50768d" stroke-width="1" rx="7"/><text x="1146" y="387" font-size="17" fill="#d1b3ef" font-weight="600">Carl [A03] · link 203</text><text x="1146" y="416" font-size="17" fill="#e1eaf0" font-weight="400">Other side: 2 members</text><text x="1146" y="443" font-size="15" fill="#acbdcd" font-weight="400">Right 2 is outside current view</text><rect x="35" y="586" width="1330" height="364" fill="#1c293a" stroke="#354b60" stroke-width="1" rx="7"/><text x="55" y="620" font-size="21" fill="#e1eaf0" font-weight="600">Choose among 5 overlapping links · authority + ID + both endset previews</text><rect x="57" y="645" width="5" height="19" fill="#7fb2ff" stroke="none" stroke-width="1" rx="0"/><text x="74" y="661" font-size="17" fill="#e1eaf0" font-weight="400">01 · comment · Alice [A01] · link 201</text><text x="440" y="661" font-size="16" fill="#acbdcd" font-weight="400">Left: draft · Right: replies</text><text x="790" y="661" font-size="16" fill="#acbdcd" font-weight="400">endsets 1 / 3</text><rect x="57" y="684" width="5" height="19" fill="#ff7a6b" stroke="none" stroke-width="1" rx="0"/><text x="74" y="700" font-size="17" fill="#e1eaf0" font-weight="400">02 · disagreement · Bob [A02] · link 202</text><text x="440" y="700" font-size="16" fill="#acbdcd" font-weight="400">Left: draft · Right: objections</text><text x="790" y="700" font-size="16" fill="#acbdcd" font-weight="400">endsets 1 / 1</text><rect x="49" y="713" width="879" height="35" fill="#342343" stroke="#b98cff" stroke-width="1" rx="5"/><rect x="57" y="723" width="5" height="19" fill="#b98cff" stroke="none" stroke-width="1" rx="0"/><text x="74" y="739" font-size="17" fill="#e1eaf0" font-weight="600">03 · authorship · Carl [A03] · link 203</text><text x="440" y="739" font-size="16" fill="#acbdcd" font-weight="400">Left: draft · Right: attribution</text><text x="790" y="739" font-size="16" fill="#acbdcd" font-weight="400">endsets 1 / 2</text><rect x="57" y="762" width="5" height="19" fill="#7fe0a8" stroke="none" stroke-width="1" rx="0"/><text x="74" y="778" font-size="17" fill="#e1eaf0" font-weight="400">04 · quotation · Devin [A04] · link 204</text><text x="440" y="778" font-size="16" fill="#acbdcd" font-weight="400">Left: draft · Right: excerpt</text><text x="790" y="778" font-size="16" fill="#acbdcd" font-weight="400">endsets 1 / 1</text><rect x="57" y="801" width="5" height="19" fill="#ffc46b" stroke="none" stroke-width="1" rx="0"/><text x="74" y="817" font-size="17" fill="#e1eaf0" font-weight="400">05 · illustration · Eve [A05] · link 205</text><text x="440" y="817" font-size="16" fill="#acbdcd" font-weight="400">Left: draft · Right: diagrams</text><text x="790" y="817" font-size="16" fill="#acbdcd" font-weight="400">endsets 1 / 4</text><text x="973" y="662" font-size="19" fill="#d1b3ef" font-weight="600">Selected · 03 / link 203</text><text x="973" y="698" font-size="17" fill="#e1eaf0" font-weight="400">Left 1/1 · occurrence 1/1</text><text x="973" y="734" font-size="17" fill="#e1eaf0" font-weight="400">Right 2/2 · occurrence 1/1</text><text x="973" y="770" font-size="17" fill="#acbdcd" font-weight="400">ACTIVE: Left · ready-visible</text><rect x="973" y="807" width="112" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="985" y="833" font-size="17" fill="#e1eaf0" font-weight="400">Cross</text><rect x="1095" y="807" width="112" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="1107" y="833" font-size="17" fill="#e1eaf0" font-weight="400">Enter</text><rect x="1217" y="807" width="112" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="1229" y="833" font-size="17" fill="#e1eaf0" font-weight="400">Origin</text><rect x="973" y="858" width="172" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="985" y="884" font-size="17" fill="#e1eaf0" font-weight="400">‹ member</text><rect x="1157" y="858" width="172" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="1169" y="884" font-size="17" fill="#e1eaf0" font-weight="400">member ›</text><rect x="973" y="903" width="172" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="985" y="929" font-size="17" fill="#e1eaf0" font-weight="400">‹ place</text><rect x="1157" y="903" width="172" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="1169" y="929" font-size="17" fill="#e1eaf0" font-weight="400">place ›</text><text x="55" y="894" font-size="17" fill="#acbdcd" font-weight="400">Color alone cannot identify ten same-type comment links.</text><text x="55" y="925" font-size="16" fill="#acbdcd" font-weight="400">View controls, not cells; all input methods expose the same IDs.</text><text x="35" y="979" font-size="14" fill="#acbdcd" font-weight="400">Five exact identities are preserved in this proposed fallback. Native overlap selection and highlight contrast remain unvalidated.</text></g></svg>