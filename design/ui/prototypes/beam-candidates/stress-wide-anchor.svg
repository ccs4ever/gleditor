<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Wide page: constrained thin leader and fallback</title><desc id="desc">A 900 pixel paper shows a short selected middle phrase distant from its margin bracket. A thin static unpickable leader uses blank interline whitespace when safe. A second example has dense text and no safe route, so exact outline and matching token 20 replace the long leader. Both preserve full endsets and independent cursors.</desc><g font-family="sans-serif"><rect x="0" y="0" width="1400" height="1000" fill="#0b111b" stroke="none" stroke-width="1" rx="0"/><text x="35" y="42" font-size="29" fill="#e1eaf0" font-weight="600">Wide page: exact phrase → bracket, only when a safe leader fits</text><text x="35" y="73" font-size="18" fill="#acbdcd" font-weight="400">A 900 px page makes a short central phrase far from its margin anchor. Thin means crisp, not invisible.</text><text x="35" y="104" font-size="14" fill="#96b4c9" font-weight="600">DESIGN MOCKUP · NOT APP RENDER · Proposed behavior; native acceptance not established</text><rect x="35" y="145" width="900" height="286" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="35" y="145" width="900" height="36" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="50" y="170" font-size="17" fill="#d5e0e9" font-weight="400">900 px page · selected-only hairline routed through blank interline space</text><text x="65" y="230" font-size="21" fill="#20313c" font-weight="400">The reader compares</text><rect x="317" y="209" width="146" height="30" fill="#d8edf0" stroke="#287f94" stroke-width="1.2" rx="0"/><text x="326" y="232" font-size="21" fill="#20313c" font-weight="600">these words</text><text x="65" y="286" font-size="21" fill="#20313c" font-weight="400">while drafting a new commentary in another store.</text><path d="M463 225V254H920V225" fill="none" stroke="#287f94" stroke-width="1.2" opacity="1" stroke-linejoin="round"/><path d="M915 210H922V239H915" fill="none" stroke="#287f94" stroke-width="2" opacity="1" stroke-linejoin="round"/><rect x="851" y="302" width="44" height="26" fill="#16495b" stroke="#78c6d4" stroke-width="1" rx="5"/><text x="857" y="321" font-size="14" fill="#e1eaf0" font-weight="600">20</text><text x="65" y="364" font-size="17" fill="#52616e" font-weight="400">Only the phrase is highlighted. The hairline occupies blank leading below it.</text><text x="65" y="395" font-size="17" fill="#52616e" font-weight="400">Static visual annotation; it creates no invisible click strip through editable text.</text><rect x="975" y="160" width="390" height="253" fill="#1c293a" stroke="#40586f" stroke-width="1" rx="7"/><text x="995" y="193" font-size="21" fill="#76cbd8" font-weight="600">Safe route available</text><text x="995" y="228" font-size="17" fill="#acbdcd" font-weight="400">Exact fragment edge → whitespace</text><text x="995" y="259" font-size="17" fill="#acbdcd" font-weight="400">→ margin bracket. No arrowhead.</text><text x="995" y="294" font-size="17" fill="#acbdcd" font-weight="400">Selected occurrence only; no always-on</text><text x="995" y="322" font-size="17" fill="#acbdcd" font-weight="400">web of leaders from every link.</text><text x="995" y="359" font-size="17" fill="#acbdcd" font-weight="400">Projected stroke must survive white</text><text x="995" y="387" font-size="17" fill="#acbdcd" font-weight="400">paper, scale and antialiasing.</text><rect x="35" y="471" width="900" height="287" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="35" y="471" width="900" height="36" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="50" y="496" font-size="17" fill="#d5e0e9" font-weight="400">Same 900 px page · no safe route: outline + matching identity tokens</text><text x="65" y="548" font-size="21" fill="#20313c" font-weight="400">Readers compare</text><rect x="262" y="528" width="285" height="30" fill="#d8edf0" stroke="#287f94" stroke-width="1.5" rx="0"/><text x="270" y="551" font-size="21" fill="#20313c" font-weight="600">this exact source phrase</text><text x="553" y="551" font-size="21" fill="#20313c" font-weight="400">with adjacent words.</text><text x="65" y="577" font-size="20" fill="#20313c" font-weight="400">Dense adjacent text leaves no safe interline channel for a leader.</text><text x="65" y="605" font-size="20" fill="#20313c" font-weight="400">A long line here would cross ink or imply unrelated text belongs to the link.</text><rect x="550" y="509" width="32" height="18" fill="#d8edf0" stroke="#287f94" stroke-width="1" rx="4"/><text x="554" y="523" font-size="14" fill="#20313c" font-weight="600">20</text><path d="M915 529H922V558H915" fill="none" stroke="#287f94" stroke-width="2" opacity="1" stroke-linejoin="round"/><rect x="856" y="531" width="44" height="26" fill="#16495b" stroke="#78c6d4" stroke-width="1" rx="5"/><text x="862" y="550" font-size="14" fill="#e1eaf0" font-weight="600">20</text><text x="65" y="675" font-size="17" fill="#52616e" font-weight="400">No long leader is drawn. Exact outline + 20 at the phrase and bracket retain identity.</text><text x="65" y="709" font-size="17" fill="#52616e" font-weight="400">The phrase is not widened; no text, caret target or other control is obscured.</text><rect x="975" y="486" width="390" height="253" fill="#1c293a" stroke="#40586f" stroke-width="1" rx="7"/><text x="995" y="519" font-size="21" fill="#76cbd8" font-weight="600">No safe route</text><text x="995" y="554" font-size="17" fill="#acbdcd" font-weight="400">Omit the leader rather than cross ink.</text><text x="995" y="587" font-size="17" fill="#acbdcd" font-weight="400">Match a local link token at each end;</text><text x="995" y="616" font-size="17" fill="#acbdcd" font-weight="400">outline marks only the exact words.</text><text x="995" y="652" font-size="17" fill="#acbdcd" font-weight="400">The token is a secondary cue; named</text><text x="995" y="681" font-size="17" fill="#acbdcd" font-weight="400">link context preserves authority and ID.</text><text x="995" y="713" font-size="17" fill="#acbdcd" font-weight="400">No token room? Keep outline + name.</text><rect x="35" y="799" width="1330" height="152" fill="#1c293a" stroke="#354b60" stroke-width="1" rx="7"/><text x="55" y="832" font-size="21" fill="#e1eaf0" font-weight="600">Alice · comment · link 20 · full ordered endsets 2 / 3 · ACTIVE: Left</text><text x="55" y="865" font-size="18" fill="#76cbd8" font-weight="400">Left 2/2 · occurrence 1/2 · ready</text><text x="706" y="865" font-size="18" fill="#e1eaf0" font-weight="400">Right 3/3 · occurrence 1/2 · ready</text><rect x="55" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="67" y="915" font-size="17" fill="#e1eaf0" font-weight="400">‹ member</text><rect x="191" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="203" y="915" font-size="17" fill="#e1eaf0" font-weight="400">member ›</text><rect x="327" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="339" y="915" font-size="17" fill="#e1eaf0" font-weight="400">‹ place</text><rect x="463" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="475" y="915" font-size="17" fill="#e1eaf0" font-weight="400">place ›</text><rect x="599" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="611" y="915" font-size="17" fill="#e1eaf0" font-weight="400">Cross</text><rect x="735" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="747" y="915" font-size="17" fill="#e1eaf0" font-weight="400">Enter</text><rect x="871" y="889" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="883" y="915" font-size="17" fill="#e1eaf0" font-weight="400">Origin</text><text x="35" y="979" font-size="14" fill="#acbdcd" font-weight="400">Whitespace clearance, text contrast, tiny marker readability and input ownership are prototype gates, not measurements established by this figure.</text></g></svg>