<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">C6 · Honest unresolved states, design-only mockup</title><desc id="desc">A status-only open stub does not invent a target position; Enter stays disabled for the missing occurrence. A comment link owned by Alice has two left members and three right members. The central gathering points are view geometry, not cells or click controls. This schematic is not an application capture.</desc><g font-family="sans-serif"><rect x="0" y="0" width="1200" height="800" fill="#0b111b" stroke="none" stroke-width="1" rx="0"/><text x="32" y="35" font-size="26" fill="#e1eaf0" font-weight="600">C6 · Honest unresolved states</text><text x="32" y="62" font-size="16" fill="#a6b5c6" font-weight="400">A status-only open stub does not invent a target position; Enter stays disabled for the missing occurrence.</text><text x="32" y="91" font-size="13" fill="#87a0b8" font-weight="600">DESIGN ONLY · NOT AN APP RENDER</text><text x="675" y="91" font-size="17" fill="#d6e0e8" font-weight="400">comment · link 20 · Alice · edition 3</text><rect x="50" y="112" width="330" height="402" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="820" y="112" width="330" height="402" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="50" y="112" width="330" height="30" fill="#243143" stroke="none" stroke-width="1" rx="0"/><rect x="820" y="112" width="330" height="30" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="66" y="133" font-size="15" fill="#cbd8e4" font-weight="400">Alice&#x27;s draft · Left 2 members</text><text x="836" y="133" font-size="15" fill="#cbd8e4" font-weight="400">Responses · Right 3 members</text><rect x="72" y="172" width="258" height="65" fill="#d8edf0" stroke="none" stroke-width="1" rx="0"/><text x="82" y="189" font-size="15" fill="#20313c" font-weight="600">ALPHA · First story idea</text><text x="82" y="208" font-size="15" fill="#20313c" font-weight="400">Draft a quiet introduction.</text><text x="82" y="227" font-size="15" fill="#20313c" font-weight="400">Let the reader find the question.</text><path d="M370 176H377V236H370" fill="none" stroke="#287f94" stroke-width="2.3" opacity="1"/><rect x="72" y="360" width="258" height="65" fill="#d8edf0" stroke="none" stroke-width="1" rx="0"/><text x="82" y="377" font-size="15" fill="#20313c" font-weight="600">OMEGA · Revised closing idea</text><text x="82" y="396" font-size="15" fill="#20313c" font-weight="400">Return to the earlier question.</text><text x="82" y="415" font-size="15" fill="#20313c" font-weight="400">Leave room for a reader response.</text><path d="M370 364H377V424H370" fill="none" stroke="#287f94" stroke-width="2.3" opacity="1"/><text x="82" y="283" font-size="15" fill="#5d6b76" font-weight="400">Unlinked gap</text><text x="82" y="307" font-size="14" fill="#5d6b76" font-weight="400">This passage belongs to neither member.</text><rect x="840" y="150" width="281" height="65" fill="#d8edf0" stroke="none" stroke-width="1" rx="0"/><text x="849" y="167" font-size="15" fill="#20313c" font-weight="600">ONE · First response</text><text x="849" y="186" font-size="15" fill="#20313c" font-weight="400">Keep the opening short.</text><text x="849" y="205" font-size="15" fill="#20313c" font-weight="400">Make the main question concrete.</text><path d="M830 154H823V214H830" fill="none" stroke="#287f94" stroke-width="2.3" opacity="1"/><rect x="840" y="278" width="281" height="65" fill="#d8edf0" stroke="none" stroke-width="1" rx="0"/><text x="849" y="295" font-size="15" fill="#20313c" font-weight="600">TWO · Second response</text><text x="849" y="314" font-size="15" fill="#20313c" font-weight="400">Show why these ideas connect.</text><text x="849" y="333" font-size="15" fill="#20313c" font-weight="400">Let the quiet paragraph breathe.</text><path d="M830 282H823V342H830" fill="none" stroke="#287f94" stroke-width="2.3" opacity="1"/><text x="844" y="426" font-size="15" fill="#5d6b76" font-weight="400">Member 3 occurrence is unavailable.</text><text x="844" y="450" font-size="14" fill="#5d6b76" font-weight="400">No passage or target is substituted.</text><text x="849" y="252" font-size="15" fill="#5d6b76" font-weight="400">Unlinked gap</text><text x="849" y="387" font-size="15" fill="#5d6b76" font-weight="400">Unlinked gap</text><path d="M380 206 C443.00 206 492.00 303 555 303" fill="none" stroke="#204959" stroke-width="10" opacity="1"/><path d="M380 206 C443.00 206 492.00 303 555 303" fill="none" stroke="#49adc3" stroke-width="8" opacity="1"/><path d="M380 206 C443.00 206 492.00 303 555 303" fill="none" stroke="#9ed2d9" stroke-width="1.2" opacity="0.75"/><path d="M380 394 C443.00 394 492.00 303 555 303" fill="none" stroke="#204959" stroke-width="10" opacity="1"/><path d="M380 394 C443.00 394 492.00 303 555 303" fill="none" stroke="#49adc3" stroke-width="8" opacity="1"/><path d="M380 394 C443.00 394 492.00 303 555 303" fill="none" stroke="#9ed2d9" stroke-width="1.2" opacity="0.75"/><path d="M645 303 C708.00 303 757.00 184 820 184" fill="none" stroke="#204959" stroke-width="10" opacity="1"/><path d="M645 303 C708.00 303 757.00 184 820 184" fill="none" stroke="#49adc3" stroke-width="8" opacity="1"/><path d="M645 303 C708.00 303 757.00 184 820 184" fill="none" stroke="#9ed2d9" stroke-width="1.2" opacity="0.75"/><path d="M645 303 C708.00 303 757.00 312 820 312" fill="none" stroke="#204959" stroke-width="10" opacity="1"/><path d="M645 303 C708.00 303 757.00 312 820 312" fill="none" stroke="#49adc3" stroke-width="8" opacity="1"/><path d="M645 303 C708.00 303 757.00 312 820 312" fill="none" stroke="#9ed2d9" stroke-width="1.2" opacity="0.75"/><path d="M555 303H645" fill="none" stroke="#214654" stroke-width="9" opacity="1"/><path d="M555 303H645" fill="none" stroke="#4aaec4" stroke-width="6" opacity="1"/><path d="M555 303H645" fill="none" stroke="#9cd2d9" stroke-width="1.2" opacity="1"/><path d="M645 303H