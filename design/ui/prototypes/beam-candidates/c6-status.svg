"42" fill="#33445a" stroke="#576b80" stroke-width="1" rx="0"/><text x="996" y="682" font-size="16" fill="#d9e4ed" font-weight="400">Origin</text><text x="72" y="714" font-size="14" fill="#a4b4c4" font-weight="400">Member/Place act on the active side; Cross switches side. Select never enters.</text><text x="50" y="751" font-size="15" fill="#a2b6c9" font-weight="400">C7 quality target: crisp shared normals at scale 1 and 1.5; bounded projected-error refinement.</text><text x="50" y="779" font-size="13" fill="#7e94aa" font-weight="400">Unit-weight cubic schematics. Not proof of rational-weight benefit, native picking, unavailable resolution or accessibility parity.</text></g></svg>