<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">C9 · Two-endset panel carousel</title><desc id="desc">Two independent carousel tracks hide off-window members; rejected as default, optional experiment only.</desc><g font-family="sans-serif"><rect x="0" y="0" width="1400" height="1000" fill="#0b121b" stroke="none" stroke-width="1.5" rx="0"/><text x="35" y="44" font-size="29" fill="#dce5ed" font-weight="600">C9 · Two-endset panel carousel</text><text x="35" y="80" font-size="18" fill="#dce5ed" font-weight="600">REJECTED AS DEFAULT · Optional panel experiment requires comparison with ordered lists.</text><text x="35" y="111" font-size="14" fill="#acbdcd" font-weight="400">DESIGN MOCKUP · NOT APP RENDER · Dashed neutral frames highlight reviewed proposal elements.</text><rect x="35" y="154" width="1330" height="90" fill="#1c293a" stroke="#405369" stroke-width="1.5" rx="7"/><text x="56" y="190" font-size="23" fill="#72cedd" font-weight="600">Alice [A01] · comment · link 20 · two independent ordered endsets</text><text x="56" y="221" font-size="17" fill="#dce5ed" font-weight="400">Left 3/12 · occurrence 1/2 · ACTIVE: Left   |   Right 2/9 · occurrence 1/3 · ready-offscreen</text><rect x="35" y="273" width="645" height="341" fill="#1c293a" stroke="#405369" stroke-width="1.5" rx="7"/><text x="57" y="309" font-size="21" fill="#dce5ed" font-weight="600">Left track · 3/12</text><path d="M90 437 Q358 665 625 437" fill="none" stroke="#546b80" stroke-width="2" opacity="1"/><rect x="51" y="327" width="613" height="265" fill="none" stroke="#dce5ed" stroke-width="1.5" rx="12" stroke-dasharray="7 6"/><rect x="608" y="285" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="617" y="306" font-size="16" fill="#0b121b" font-weight="600">1</text><rect x="64" y="351" width="184" height="133" fill="#273a4c" stroke="#546b80" stroke-width="1.5" rx="6"/><text x="78" y="379" font-size="17" fill="#dce5ed" font-weight="600">Member 2/12</text><text x="78" y="408" font-size="15" fill="#acbdcd" font-weight="400">Exact left preview</text><text x="78" y="435" font-size="15" fill="#acbdcd" font-weight="400">Preview only</text><text x="78" y="463" font-size="14" fill="#dce5ed" font-weight="400">Not entered</text><rect x="267" y="392" width="184" height="133" fill="#273a4c" stroke="#72cedd" stroke-width="1.5" rx="6"/><text x="281" y="420" font-size="17" fill="#dce5ed" font-weight="600">Member 3/12</text><text x="281" y="449" font-size="15" fill="#acbdcd" font-weight="400">Exact left preview</text><text x="281" y="476" font-size="15" fill="#acbdcd" font-weight="400">Chosen occurrence</text><text x="281" y="504" font-size="14" fill="#dce5ed" font-weight="400">1/2 · ready</text><rect x="470" y="351" width="184" height="133" fill="#273a4c" stroke="#546b80" stroke-width="1.5" rx="6"/><text x="484" y="379" font-size="17" fill="#dce5ed" font-weight="600">Member 4/12</text><text x="484" y="408" font-size="15" fill="#acbdcd" font-weight="400">Exact left preview</text><text x="484" y="435" font-size="15" fill="#acbdcd" font-weight="400">Preview only</text><text x="484" y="463" font-size="14" fill="#dce5ed" font-weight="400">Not entered</text><rect x="61" y="561" width="175" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="73" y="587" font-size="16" fill="#dce5ed" font-weight="400">Previous left</text><rect x="244" y="561" width="155" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="256" y="587" font-size="16" fill="#dce5ed" font-weight="400">Next left</text><text x="420" y="587" font-size="15" fill="#acbdcd" font-weight="400">9 members outside window</text><rect x="720" y="273" width="645" height="341" fill="#1c293a" stroke="#405369" stroke-width="1.5" rx="7"/><text x="742" y="309" font-size="21" fill="#dce5ed" font-weight="600">Right track · 2/9</text><path d="M775 437 Q1043 665 1310 437" fill="none" stroke="#546b80" stroke-width="2" opacity="1"/><rect x="736" y="327" width="613" height="265" fill="none" stroke="#dce5ed" stroke-width="1.5" rx="12" stroke-dasharray="7 6"/><rect x="1293" y="285" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="1302" y="306" font-size="16" fill="#0b121b" font-weight="600">2</text><rect x="749" y="351" width="184" height="133" fill="#273a4c" stroke="#546b80" stroke-width="1.5" rx="6"/><text x="763" y="379" font-size="17" fill="#dce5ed" font-weight="600">Member 1/9</text><text x="763" y="408" font-size="15" fill="#acbdcd" font-weight="400">Exact right preview</text><text x="763" y="435" font-size="15" fill="#acbdcd" font-weight="400">Preview only</text><text x="763" y="463" font-size="14" fill="#dce5ed" font-weight="400">Not entered</text><rect x="952" y="392" width="184" height="133" fill="#273a4c" stroke="#72cedd" stroke-width="1.5" rx="6"/><text x="966" y="420" font-size="17" fill="#dce5ed" font-weight="600">Member 2/9</text><text x="966" y="449" font-size="15" fill="#acbdcd" font-weight="400">Exact right preview</text><text x="966" y="476" font-size="15" fill="#acbdcd" font-weight="400">Chosen occurrence</text><text x="966" y="504" font-size="14" fill="#dce5ed" font-weight="400">1/3 · outside view</text><rect x="1155" y="351" width="184" height="133" fill="#273a4c" stroke="#546b80" stroke-width="1.5" rx="6"/><text x="1169" y="379" font-size="17" fill="#dce5ed" font-weight="600">Member 3/9</text><text x="1169" y="408" font-size="15" fill="#acbdcd" font-weight="400">Exact right preview</text><text x="1169" y="435" font-size="15" fill="#acbdcd" font-weight="400">Preview only</text><text x="1169" y="463" font-size="14" fill="#dce5ed" font-weight="400">Not entered</text><rect x="746" y="561" width="175" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="758" y="587" font-size="16" fill="#dce5ed" font-weight="400">Previous right</text><rect x="929" y="561" width="155" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="941" y="587" font-size="16" fill="#dce5ed" font-weight="400">Next right</text><text x="1105" y="587" font-size="15" fill="#acbdcd" font-weight="400">6 members outside window</text><rect x="35" y="645" width="650" height="167" fill="#1c293a" stroke="#536575" stroke-width="1.5" rx="7"/><rect x="50" y="660" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="59" y="681" font-size="16" fill="#0b121b" font-weight="600">1</text><text x="92" y="681" font-size="19" fill="#dce5ed" font-weight="600">Rejected default: rotating a partial member window</text><text x="53" y="713" font-size="16" fill="#acbdcd" font-weight="400">Most members are hidden while existing lists already browse them.</text><text x="53" y="740" font-size="16" fill="#acbdcd" font-weight="400">A new mode needs evidence that it beats two ordered lists.</text><text x="53" y="767" font-size="16" fill="#acbdcd" font-weight="400">Left changes independently; Right keeps its current selection.</text><rect x="705" y="645" width="660" height="167" fill="#1c293a" stroke="#536575" stroke-width="1.5" rx="7"/><rect x="720" y="660" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="729" y="681" font-size="16" fill="#0b121b" font-weight="600">2</text><text x="762" y="681" font-size="19" fill="#dce5ed" font-weight="600">Optional only: separate tracks with ordinary fallback</text><text x="723" y="713" font-size="16" fill="#acbdcd" font-weight="400">No paired rotation, shared world hub or forced 3D dragging.</text><text x="723" y="740" font-size="16" fill="#acbdcd" font-weight="400">Both counts, exact previews and occurrence controls stay named.</text><text x="723" y="767" font-size="16" fill="#acbdcd" font-weight="400">Reduced motion cuts between items; Enter remains explicit.</text><rect x="35" y="840" width="1330" height="105" fill="#1c293a" stroke="#405369" stroke-width="1.5" rx="7"/><rect x="56" y="861" width="204" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="68" y="887" font-size="16" fill="#dce5ed" font-weight="400">Use ordered lists</text><rect x="274" y="861" width="191" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="286" y="887" font-size="16" fill="#dce5ed" font-weight="400">Left occurrence</text><rect x="479" y="861" width="194" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="491" y="887" font-size="16" fill="#dce5ed" font-weight="400">Right occurrence</text><rect x="688" y="861" width="105" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="700" y="887" font-size="16" fill="#dce5ed" font-weight="400">Cross</text><rect x="808" y="861" width="143" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="820" y="887" font-size="16" fill="#dce5ed" font-weight="400">Enter endpoint</text><rect x="966" y="861" width="105" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="978" y="887" font-size="16" fill="#dce5ed" font-weight="400">Origin</text><rect x="1086" y="861" width="177" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="1098" y="887" font-size="16" fill="#dce5ed" font-weight="400">Dismiss preview</text><text x="56" y="925" font-size="16" fill="#acbdcd" font-weight="400">Only the track presentation is rejected as the default. Independent cursors and explicit entry remain required.</text><text x="35" y="977" font-size="14" fill="#acbdcd" font-weight="400">Static vector concept. Annotation frames are explanatory, not controls, hit corridors or measured runtime geometry.</text></g></svg>