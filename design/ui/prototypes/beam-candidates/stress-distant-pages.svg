<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Distant KJV page members</title><desc id="desc">Three separate short members on first, middle and last KJV pages. First and last appear as separate previews; the chosen middle member is explicitly outside the current view and has no fabricated anchor. No bracket or spine connects omitted pages. All ordered members remain in context and explicit Enter can request the exact target.</desc><g font-family="sans-serif"><rect x="0" y="0" width="1400" height="1000" fill="#0b111b" stroke="none" stroke-width="1" rx="0"/><text x="35" y="42" font-size="29" fill="#e1eaf0" font-weight="600">Distant pages: three members, three places, no invented extent</text><text x="35" y="73" font-size="18" fill="#acbdcd" font-weight="400">First / middle / last KJV pages are separate short members. Only two source page previews are visible.</text><text x="35" y="104" font-size="14" fill="#96b4c9" font-weight="600">DESIGN MOCKUP · NOT APP RENDER · Proposed behavior; native acceptance not established</text><rect x="35" y="145" width="445" height="190" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="35" y="145" width="445" height="36" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="50" y="170" font-size="17" fill="#d5e0e9" font-weight="400">KJV · page 1 of P · member 1/3</text><text x="60" y="214" font-size="21" fill="#20313c" font-weight="400">In the beginning God created</text><rect x="56" y="223" width="337" height="34" fill="#d8edf0" stroke="#287f94" stroke-width="1" rx="0"/><text x="64" y="247" font-size="21" fill="#20313c" font-weight="600">the heaven and the earth.</text><text x="60" y="299" font-size="16" fill="#52616e" font-weight="400">Exact short span; surrounding text is unlinked.</text><path d="M462 224H469V256H462" fill="none" stroke="#287f94" stroke-width="2" opacity="1" stroke-linejoin="round"/><rect x="35" y="489" width="445" height="190" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="35" y="489" width="445" height="36" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="50" y="514" font-size="17" fill="#d5e0e9" font-weight="400">KJV · page P of P · member 3/3</text><text x="60" y="559" font-size="21" fill="#20313c" font-weight="400">The grace of our Lord Jesus Christ</text><rect x="56" y="568" width="309" height="34" fill="#d8edf0" stroke="#287f94" stroke-width="1" rx="0"/><text x="64" y="593" font-size="21" fill="#20313c" font-weight="600">be with you all. Amen.</text><text x="60" y="644" font-size="16" fill="#52616e" font-weight="400">Exact span; gaps between members stay unmarked.</text><path d="M462 569H469V601H462" fill="none" stroke="#287f94" stroke-width="2" opacity="1" stroke-linejoin="round"/><rect x="35" y="365" width="445" height="93" fill="#1c293a" stroke="#41576d" stroke-width="1" rx="7"/><text x="54" y="393" font-size="18" fill="#e1eaf0" font-weight="600">Member 2/3 · page ceil(P/2)</text><text x="54" y="421" font-size="17" fill="#acbdcd" font-weight="400">Outside current view · occurrence 1/1</text><text x="54" y="444" font-size="15" fill="#acbdcd" font-weight="400">Known exact target; no paper or anchor invented.</text><rect x="988" y="265" width="377" height="320" fill="#f0f2f3" stroke="none" stroke-width="1" rx="0"/><rect x="988" y="265" width="377" height="36" fill="#243143" stroke="none" stroke-width="1" rx="0"/><text x="1003" y="290" font-size="17" fill="#d5e0e9" font-weight="400">Study note · Right 1 member</text><rect x="1008" y="355" width="334" height="84" fill="#d8edf0" stroke="#287f94" stroke-width="1" rx="0"/><text x="1020" y="381" font-size="20" fill="#20313c" font-weight="600">Creation, wisdom and blessing</text><text x="1020" y="409" font-size="17" fill="#20313c" font-weight="400">Read each passage on its own terms.</text><text x="1015" y="489" font-size="17" fill="#52616e" font-weight="400">No authored pairing is implied.</text><path d="M1004 357H997V437H1004" fill="none" stroke="#287f94" stroke-width="2" opacity="1" stroke-linejoin="round"/><path d="M480 240 C575 240 590 397 679 397" fill="none" stroke="#76cbd8" stroke-width="3" opacity="1" stroke-linejoin="round"/><path d="M480 585 C575 585 590 397 679 397" fill="none" stroke="#76cbd8" stroke-width="3" opacity="1" stroke-linejoin="round"/><path d="M679 397H734" fill="none" stroke="#76cbd8" stroke-width="3" opacity="1" stroke-linejoin="round"/><path d="M734 397 C827 397 889 397 988 397" fill="none" stroke="#76cbd8" stroke-width="3" opacity="1" stroke-linejoin="round"/><text x="522" y="217" font-size="17" fill="#acbdcd" font-weight="400">Visible branches only</text><text x="522" y="672" font-size="16" fill="#acbdcd" font-weight="400">No margin spine across omitted pages</text><rect x="35" y="713" width="1330" height="233" fill="#1c293a" stroke="#354b60" stroke-width="1" rx="7"/><text x="56" y="745" font-size="21" fill="#e1eaf0" font-weight="600">Alice [A01] · comment · link 20 · edition 3 · full ordered endsets 3 / 1</text><text x="56" y="779" font-size="18" fill="#76cbd8" font-weight="600">Left 2/3 · occurrence 1/1 · ACTIVE</text><text x="757" y="779" font-size="18" fill="#e1eaf0" font-weight="400">Right 1/1 · occurrence 1/1 · ready</text><text x="56" y="811" font-size="18" fill="#e1eaf0" font-weight="400">01 page 1: visible   ·   02 middle page: outside view   ·   03 last page: visible</text><text x="56" y="840" font-size="17" fill="#acbdcd" font-weight="400">Visible source members 2/3; all three remain selectable. Outside view is not unavailable.</text><rect x="56" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="68" y="895" font-size="17" fill="#e1eaf0" font-weight="400">‹ member</text><rect x="192" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="204" y="895" font-size="17" fill="#e1eaf0" font-weight="400">member ›</text><rect x="328" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="340" y="895" font-size="17" fill="#e1eaf0" font-weight="400">‹ place</text><rect x="464" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="476" y="895" font-size="17" fill="#e1eaf0" font-weight="400">place ›</text><rect x="600" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="612" y="895" font-size="17" fill="#e1eaf0" font-weight="400">Cross</text><rect x="736" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="748" y="895" font-size="17" fill="#e1eaf0" font-weight="400">Enter</text><rect x="872" y="869" width="125" height="39" fill="#33445a" stroke="#50677d" stroke-width="1" rx="0"/><text x="884" y="895" font-size="17" fill="#e1eaf0" font-weight="400">Origin</text><rect x="1008" y="869" width="125" height="39" fill="#273243" stroke="#50677d" stroke-width="1" rx="0"/><text x="1020" y="895" font-size="17" fill="#a6b4c1" font-weight="400">Cancel</text><text x="56" y="933" font-size="16" fill="#acbdcd" font-weight="400">Enter requests the exact chosen middle page; success alone completes a visit. Origin remains available.</text><text x="35" y="979" font-size="14" fill="#acbdcd" font-weight="400">Page numbers depend on edition and layout; first / middle / last are scenario positions. This is not a native KJV rendering or journey pass.</text></g></svg>