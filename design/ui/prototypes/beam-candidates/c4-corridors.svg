<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">C4 · Separate planar corridors</title><desc id="desc">Deferred per-link corridor reservations keep exact anchors but cannot eliminate forced crossings.</desc><g font-family="sans-serif"><rect x="0" y="0" width="1400" height="1000" fill="#0b121b" stroke="none" stroke-width="1.5" rx="0"/><text x="35" y="44" font-size="29" fill="#dce5ed" font-weight="600">C4 · Separate planar corridors</text><text x="35" y="80" font-size="18" fill="#dce5ed" font-weight="600">DEFERRED ROUTING EXPERIMENT · Crossing disambiguation is required independently.</text><text x="35" y="111" font-size="14" fill="#acbdcd" font-weight="400">DESIGN MOCKUP · NOT APP RENDER · Dashed neutral frames highlight reviewed proposal elements.</text><rect x="35" y="155" width="345" height="435" fill="#f0f2f3" stroke="none" stroke-width="1.5" rx="0"/><rect x="35" y="155" width="345" height="36" fill="#263344" stroke="none" stroke-width="1.5" rx="0"/><text x="49" y="180" font-size="17" fill="#dce5ed" font-weight="400">Draft · exact local anchors</text><rect x="1020" y="155" width="345" height="435" fill="#f0f2f3" stroke="none" stroke-width="1.5" rx="0"/><rect x="1020" y="155" width="345" height="36" fill="#263344" stroke="none" stroke-width="1.5" rx="0"/><text x="1034" y="180" font-size="17" fill="#dce5ed" font-weight="400">Responses · exact local anchors</text><text x="60" y="270" font-size="20" fill="#263742" font-weight="400">Passage 01 · linked words</text><path d="M365 252 h8 v30 h-8" fill="none" stroke="#277d91" stroke-width="2" opacity="1"/><text x="1047" y="270" font-size="20" fill="#263742" font-weight="400">Response 03 · exact span</text><path d="M1036 252 h-8 v30 h8" fill="none" stroke="#41668f" stroke-width="2" opacity="1"/><text x="60" y="385" font-size="20" fill="#263742" font-weight="400">Passage 02 · linked words</text><path d="M365 367 h8 v30 h-8" fill="none" stroke="#74559b" stroke-width="2" opacity="1"/><text x="1047" y="385" font-size="20" fill="#263742" font-weight="400">Response 02 · exact span</text><path d="M1036 367 h-8 v30 h8" fill="none" stroke="#74559b" stroke-width="2" opacity="1"/><text x="60" y="500" font-size="20" fill="#263742" font-weight="400">Passage 03 · linked words</text><path d="M365 482 h8 v30 h-8" fill="none" stroke="#41668f" stroke-width="2" opacity="1"/><text x="1047" y="500" font-size="20" fill="#263742" font-weight="400">Response 01 · exact span</text><path d="M1036 482 h-8 v30 h8" fill="none" stroke="#277d91" stroke-width="2" opacity="1"/><rect x="418" y="180" width="564" height="390" fill="none" stroke="#dce5ed" stroke-width="1.5" rx="12" stroke-dasharray="7 6"/><rect x="429" y="190" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="438" y="211" font-size="16" fill="#0b121b" font-weight="600">1</text><text x="474" y="214" font-size="17" fill="#acbdcd" font-weight="400">Per-link corridor study · view-only</text><path d="M380 272 C435 272 430 240 480 240 C590 240 820 510 920 510 C970 510 984 502 1020 502" fill="none" stroke="#dce5ed" stroke-width="16" opacity="0.13" stroke-dasharray="8 7"/><path d="M380 387 C490 387 510 387 700 387 C850 387 922 387 1020 387" fill="none" stroke="#dce5ed" stroke-width="16" opacity="0.13" stroke-dasharray="8 7"/><path d="M380 502 C442 502 451 538 505 538 C640 538 790 272 920 272 C970 272 983 272 1020 272" fill="none" stroke="#dce5ed" stroke-width="16" opacity="0.13" stroke-dasharray="8 7"/><path d="M380 272 C435 272 430 240 480 240 C590 240 820 510 920 510 C970 510 984 502 1020 502" fill="none" stroke="#72cedd" stroke-width="3.5" opacity="1"/><path d="M380 387 C490 387 510 387 700 387 C850 387 922 387 1020 387" fill="none" stroke="#b89cec" stroke-width="2.5" opacity="1"/><path d="M380 502 C442 502 451 538 505 538 C640 538 790 272 920 272 C970 272 983 272 1020 272" fill="none" stroke="#7bade7" stroke-width="2.5" opacity="1"/><text x="464" y="563" font-size="16" fill="#acbdcd" font-weight="400">Separate identities; crossings remain crossings.</text><rect x="598" y="310" width="165" height="142" fill="none" stroke="#dce5ed" stroke-width="1.5" rx="6" stroke-dasharray="5 5"/><rect x="767" y="318" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="776" y="339" font-size="16" fill="#0b121b" font-weight="600">2</text><rect x="35" y="618" width="650" height="156" fill="#1c293a" stroke="#536575" stroke-width="1.5" rx="7"/><rect x="50" y="633" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="59" y="654" font-size="16" fill="#0b121b" font-weight="600">1</text><text x="92" y="654" font-size="19" fill="#dce5ed" font-weight="600">Deferred: reservation and local rerouting</text><text x="53" y="686" font-size="16" fill="#acbdcd" font-weight="400">Extra poles / knots shape local clearance around reading areas.</text><text x="53" y="713" font-size="16" fill="#acbdcd" font-weight="400">Lane persistence needs layout, exclusion and motion validation.</text><text x="53" y="740" font-size="16" fill="#acbdcd" font-weight="400">The anchor pages and exact linked passages stay in place.</text><rect x="705" y="618" width="660" height="156" fill="#1c293a" stroke="#536575" stroke-width="1.5" rx="7"/><rect x="720" y="633" width="29" height="29" fill="#dce5ed" stroke="none" stroke-width="1.5" rx="5"/><text x="729" y="654" font-size="16" fill="#0b121b" font-weight="600">2</text><text x="762" y="654" font-size="19" fill="#dce5ed" font-weight="600">Required already: choose the link at overlap</text><text x="723" y="686" font-size="16" fill="#acbdcd" font-weight="400">A crossing is not a junction and does not merge authority IDs.</text><text x="723" y="713" font-size="16" fill="#acbdcd" font-weight="400">Named candidates resolve ambiguity; topmost pixels do not.</text><text x="723" y="740" font-size="16" fill="#acbdcd" font-weight="400">Routing cannot promise a crossing-free reversed endpoint order.</text><rect x="35" y="796" width="1330" height="147" fill="#1c293a" stroke="#405369" stroke-width="1.5" rx="6"/><text x="55" y="830" font-size="21" fill="#72cedd" font-weight="600">Selected: Alice [A01] · comment · link 20</text><text x="55" y="862" font-size="17" fill="#dce5ed" font-weight="400">Left 1/1 · occurrence 1/1     |     Right 1/1 · occurrence 1/1     |     Active: Left</text><text x="55" y="890" font-size="16" fill="#acbdcd" font-weight="400">Other crossing candidates: Carl [A03] authorship 21 · Bob [A02] comment 22</text><rect x="1000" y="898" width="100" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="1012" y="924" font-size="16" fill="#dce5ed" font-weight="400">Choose link</text><rect x="1112" y="898" width="95" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="1124" y="924" font-size="16" fill="#dce5ed" font-weight="400">Cross</text><rect x="1219" y="898" width="110" height="39" fill="#33445a" stroke="#50677d" stroke-width="1.5" rx="0"/><text x="1231" y="924" font-size="16" fill="#dce5ed" font-weight="400">Enter</text><text x="35" y="977" font-size="14" fill="#acbdcd" font-weight="400">Static vector concept. Annotation frames are explanatory, not controls, hit corridors or measured runtime geometry.</text></g></svg>