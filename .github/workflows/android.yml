name: Android

# Path-filtered on push, since this build is expensive (vcpkg compiles
# pango's whole dependency stack from source, for two ABIs) and most pushes
# touch neither the Android project nor the library code it builds.
# workflow_dispatch is kept alongside it for re-running against an unchanged
# tree, which the path filter would otherwise never allow.
on:
  push:
    paths:
      - "CMakeLists.txt"
      - "packaging/android/**"
      - "src/**"
      - "include/**"
      - "apps/gleditor/**"
      - "thirdparty/SDL"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Plain `git describe --tags` -- what both app/build.gradle's
          # gitDescribeVersion() and CMakeLists.txt's own copy of the same
          # logic run -- sees no tags at all against actions/checkout's
          # default shallow clone, and silently falls back to VERSION
          # instead of failing. Fetching real history is what lets a build
          # off a tagged commit actually report that tag.
          fetch-depth: 0

      - name: pin the NDK version app/build.gradle asks for
        id: ndk
        run: echo "version=27.3.13750724" >> "$GITHUB_OUTPUT"

      - uses: android-actions/setup-android@v3

      - name: install the NDK, platform and build tools
        run: |
          set -eu
          sdkmanager --install \
            "ndk;${{ steps.ndk.outputs.version }}" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.ndk.outputs.version }}" >> "$GITHUB_ENV"

      # vcpkg's own build tools -- gperf, needed transitively by the pango
      # stack, is what actually asks for these -- are expected to already be
      # on the host, the same as pkg-config or a compiler; vcpkg does not
      # vendor them. Installed once here rather than left for whichever port
      # first needs them, since vcpkg's own error for a missing one names the
      # port, not the workflow step that should have prevented it.
      - name: host build tools vcpkg's ports need
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool jq unzip

      - name: vulkan validation layers
        working-directory: packaging/android
        run: ./fetch-validation-layers.sh

      # A shallow clone at the exact commit vcpkg.json's builtin-baseline
      # names, rather than whatever HEAD of the vcpkg repo happens to be on
      # the day this runs: the baseline is what actually pins port versions,
      # and cloning a different commit than it names would just be a second,
      # looser pin fighting the first.
      - name: vcpkg
        run: |
          set -eu
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout f298fb4ef3a7ae09766b6a5beb92ce171a767927
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's own binary cache, keyed on the manifest and the pinned vcpkg
      # commit: pango's dependency stack (glib, cairo, harfbuzz, freetype,
      # fontconfig, glibmm, pangomm) compiling from source for two triplets is
      # the slow part of this workflow by far, and none of it changes between
      # runs that touch only this project's own sources.
      #
      # restore/save as two separate steps rather than the combined
      # actions/cache action, with the save on `if: always()`: the combined
      # action's own post-job save silently did not run after the first
      # successful vcpkg build here, so the next run paid the full ~18 minute
      # rebuild again despite nothing in vcpkg.json having changed. An
      # explicit save that is not conditioned on the rest of the job
      # succeeding is what actually guarantees a config-step failure below
      # (which is what this workflow has been hitting) does not throw away a
      # vcpkg build that already finished.
      - name: restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-android-${{ hashFiles('packaging/android/vcpkg.json') }}-f298fb4ef3a7ae09766b6a5beb92ce171a767927
      - run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: gradlew assembleDebug
        working-directory: packaging/android
        run: ./gradlew assembleDebug --stacktrace

      - if: always()
        name: save vcpkg binary cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-android-${{ hashFiles('packaging/android/vcpkg.json') }}-f298fb4ef3a7ae09766b6a5beb92ce171a767927

      # CMake's own File API reply -- what AGP's "error parsing CMake File
      # API result" means it could not make sense of -- plus the raw
      # configure logs. The whole tree rather than picking specific files
      # inside it: the first attempt at this named individual paths under
      # .cxx and .cmake and uploaded nothing, since actions/upload-artifact
      # excludes dot-directories unless told not to. include-hidden-files is
      # that override; taking the whole directory besides is what makes this
      # robust to not already knowing the exact layout AGP produced.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-diagnostics
          path: packaging/android/app/.cxx
          include-hidden-files: true
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: gleditor-debug-apks
          path: packaging/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # A real device is what packaging/android/README.md asks a person to test
  # against, but a headless emulator on the runner is what catches a build
  # that only looks right -- a manifest AAPT2 accepted, a native library that
  # links, or an asset path that resolves on the build machine and nowhere
  # else -- before it ever reaches one. x86_64 rather than arm64-v8a: this
  # runner has no hardware acceleration for the latter (there is no ARM host
  # to virtualize on), and TCG-emulated arm64 is slow enough that "boots
  # within the job timeout" stops being a given. -gpu swiftshader is this
  # job's equivalent of the desktop workflow's lavapipe/llvmpipe: a software
  # renderer standing in for a GPU the runner does not have, so both the GLES
  # and (once vkEnumeratePhysicalDevices is asked) the Vulkan backend get
  # something to draw through.
  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gleditor-debug-apks
          path: apks

      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "system-images;android-30;google_apis;x86_64" "emulator"

      # GitHub's own runners have /dev/kvm, but not always the permissions to
      # use it; the emulator falls back to unaccelerated TCG rather than
      # failing outright when this does nothing, which is why it is a step of
      # its own instead of a precondition the job fails without.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: boot a headless emulator
        run: |
          set -eu
          # avdmanager and emulator both fall back to $HOME/.android/avd when
          # this is unset, but set it explicitly and create it up front
          # rather than trust that default and that the directory already
          # exists -- avdmanager does not create parents of $HOME/.android
          # itself, and a create that silently wrote nowhere real is exactly
          # what left the previous run's emulator stuck waiting for a device
          # that could never appear (adb wait-for-device has no timeout of
          # its own, so it hung until the job's).
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel_4" -f
          echo "AVDs known to avdmanager:"; avdmanager list avd
          echo "$ANDROID_AVD_HOME:"; ls -la "$ANDROID_AVD_HOME"
          [ -f "$ANDROID_AVD_HOME/test.ini" ] || { echo "::error::avdmanager did not write $ANDROID_AVD_HOME/test.ini" >&2; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -accel auto &
          timeout 120 adb wait-for-device
          timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'

      - name: install and launch gleditor
        run: |
          set -eu
          adb install -r apks/x86_64/debug/app-x86_64-debug.apk
          adb shell am start -n io.github.ccs4ever.gleditor/org.libsdl.app.SDLActivity
          # SDL's own startup (loading libSDL3.so and libmain.so, then this
          # project's asset extraction and Pango/fontconfig initialisation in
          # androidBootstrap()) is what this sleep is giving room to finish
          # before the process is checked for rather than caught mid-launch.
          sleep 15
          adb exec-out screencap -p > gleditor-emulator.png
          if [ -z "$(adb shell pidof io.github.ccs4ever.gleditor)" ]; then
            echo "::error::gleditor is not running 15s after launch -- it crashed or never started" >&2
            exit 1
          fi

      - if: always()
        run: adb logcat -d > logcat.txt || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gleditor-emulator-smoke-test
          path: |
            gleditor-emulator.png
            logcat.txt
          if-no-files-found: warn
