name: One-shot cleanup repair

on:
  push:
    branches: [remove-120fps-target]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-120fps-target
          fetch-depth: 0
      - name: Repair wording and verify cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          skip={'.github/workflows/remove-120fps-cleanup.yml','.github/workflows/remove-120fps-repair.yml'}
          files=[f for f in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if f and f not in skip]
          fixes={
            'Hot rendering loops (interactive target / render-path latency) must have **zero dynamic memory\n  allocations**.':'Hot rendering loops must have **zero dynamic memory allocations**.',
            '**Framerate Budget**: Interactive rendering at 60–interactive ($8.33\\text{ms} - 16.6\\text{ms}$).':'**Interactive Rendering**: Keep render-path latency responsive and verify it empirically.',
            '**Framerate Budget**: Interactive rendering at 60-interactive ($8.33\\text{ms} - 16.6\\text{ms}$).':'**Interactive Rendering**: Keep render-path latency responsive and verify it empirically.',
            'against an frame time frame, now 0.7--1.4 ms.':'before caching, now 0.7--1.4 ms.',
            'under 0.08% of an frame time frame,':'both negligible at this traversal size,',
            'which is most of an frame time frame on its\n   own;':'which is substantial per-frame CPU work on its\n   own;',
            '2.9 µs against an frame time frame,':'2.9 µs at the measured traversal size,',
            'against frame time.':'in absolute terms.',
            '| %.1fx | budget in real time frame time\\n':'| %.1fx\\n',
            'Unified Transclusion Engine & interactive Rendering':'Unified Transclusion Engine & Interactive Rendering',
            'interactive performance budget for <target_module_or_feature>':'interactive performance characteristics for <target_module_or_feature>',
          }
          for name in files:
            p=Path(name)
            try:text=p.read_text(encoding='utf-8')
            except (UnicodeDecodeError,OSError):continue
            old=text
            for a,b in fixes.items():text=text.replace(a,b)
            if text!=old:p.write_text(text,encoding='utf-8')
          bad=[r'120\s*FPS',r'120fps',r'8\.33\s*ms',r'8\.33\\,?\\text\{ms\}',r'60[–-]interactive',r'an frame time frame',r'budget in real time frame time',r'interactive target / render-path latency']
          offenders=[]
          for name in files:
            p=Path(name)
            try:text=p.read_text(encoding='utf-8')
            except (UnicodeDecodeError,OSError):continue
            if any(re.search(x,text,re.I) for x in bad):offenders.append(name)
          if offenders:raise SystemExit('remaining cleanup artifacts: '+', '.join(offenders))
          PY
      - name: Commit repair and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/remove-120fps-cleanup.yml .github/workflows/remove-120fps-repair.yml
          git add -A
          git commit -m "Polish repo-wide 120 FPS cleanup wording"
          git push origin HEAD:remove-120fps-target
