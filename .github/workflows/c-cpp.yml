name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Formatting and the text-only linters, kept out of the build matrix so a
  # missing semicolon in a comment does not wait on a full SDL2/SDL3 compile
  # to be reported, and so this job needs none of that matrix's dependencies
  # at all -- format, format-check and lint are exempted in the Makefile from
  # both the pkg-config checks and the dependency-file rebuild that every
  # other goal triggers, for exactly this reason.
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: packages
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          clang-format shfmt shellcheck yamllint markdownlint
        # yamlfmt and mdformat aren't apt packages; go and pip are already on
        # this image. GOPATH/bin is where `go install` puts the binary, and
        # has to be on PATH for the make targets that call it by name.
        go install github.com/google/yamlfmt/cmd/yamlfmt@latest
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        pip install --quiet mdformat mdformat-gfm
    - name: make format-check
      run: make format-check
    - name: make lint
      run: make lint

  # flake.nix and packaging/nix/gleditor.nix, formatted against the same
  # formatter the flake itself names as its `formatter` output and linted
  # with nix-linter -- a separate job because it needs Nix installed and
  # nothing else here does.
  nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - name: nixfmt --check
      run: nix run nixpkgs#nixfmt-rfc-style -- --check flake.nix packaging/nix/gleditor.nix
    # nix-linter has no flake of its own and isn't in nixpkgs, so it's built
    # from its source repo against the nixpkgs revision it's pinned to; the
    # nix-linter Cachix cache is what keeps that a fetch instead of a
    # from-scratch GHC build.
    - uses: cachix/cachix-action@v17
      with:
        name: nix-linter
    - name: nix-linter
      run: |
        git clone --depth 1 https://github.com/Synthetica9/nix-linter /tmp/nix-linter
        nix-build /tmp/nix-linter/default.nix -o /tmp/nix-linter-result
        /tmp/nix-linter-result/bin/nix-linter flake.nix packaging/nix/gleditor.nix

  build:

    runs-on: ubuntu-latest

    # SDL3 is what the code is written against; SDL2 is what most distributions
    # still ship. Both are built and tested, as parallel jobs, so a change that
    # only compiles against one of them fails here rather than on someone's
    # machine. fail-fast is off because which of the two broke is the useful
    # part of the answer.
    strategy:
      fail-fast: false
      matrix:
        sdl: [2, 3]

    name: build (SDL${{ matrix.sdl }})

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    # SDL3 is not in the Ubuntu archive yet; SDL2 is, so only one job needs the
    # PPA.
    - name: sdl3 ppa add
      if: matrix.sdl == 3
      run: sudo add-apt-repository -y ppa:hrzhu/sdl3-backport
    - name: update apt
      run: sudo apt-get update
    # apt on the hosted runners is configured to delete each .deb as soon as it
    # is unpacked, so there is nothing to cache until it is told otherwise.
    - name: keep downloaded packages
      # yamllint disable-line rule:line-length
      run: echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloads
    # Cached under the runner's home rather than /var/cache/apt/archives:
    # actions/cache restores as the runner user and cannot write into a
    # root-owned directory. The package step copies between the two.
    #
    # The key covers this file, so editing the package list starts a fresh
    # cache. A stale entry is not a correctness problem either way -- apt
    # verifies what it finds and downloads whatever is missing or superseded.
    - name: package cache
      uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-sdl${{ matrix.sdl }}-${{ hashFiles('.github/workflows/c-cpp.yml') }}
        restore-keys: apt-sdl${{ matrix.sdl }}-
    # PKGS in the Makefile is: freetype2 harfbuzz fribidi libunibreak fontconfig
    # <sdl2|sdl3> gl (+ vulkan when GLEDITOR_ENABLE_VULKAN is set). SDL_image is
    # optional and SDL3_image is in neither the archive nor the SDL3 backport PPA,
    # so it is left out of both jobs to keep them comparable; the window icon is
    # skipped without it. The GL and GLES entry points are resolved at runtime
    # through SDL, so no GL library is linked; libgl-dev is still needed for
    # GL/glcorearb.h. mesa-vulkan-drivers provides lavapipe, a software Vulkan
    # device, and the validation layers catch API misuse that would otherwise only
    # show up as a blank window.
    - name: packages
      run: |
        set -eu
        # Seed apt's archive from the cache before resolving. Anything already
        # present is not fetched again.
        sudo mkdir -p /var/cache/apt/archives
        if [ -d ~/apt-archives ]; then
          sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        fi

        sudo apt-get install -y \
          ${{ matrix.sdl == 3 && 'libsdl3-dev' || 'libsdl2-dev' }} \
          libglm-dev libfreetype-dev libharfbuzz-dev \
          libfribidi-dev libunibreak-dev libfontconfig-dev \
          libgl-dev libgl1-mesa-dev libglu1-mesa-dev \
          libvulkan-dev glslang-tools \
          mesa-vulkan-drivers vulkan-validationlayers \
          libgmock-dev libgtest-dev \
          libtorrent-rasterbar-dev libssl-dev liblmdb-dev gnupg \
          xvfb \
          clang libclang-rt-dev make

        # autoclean drops .debs the archive no longer offers, so the cache does
        # not accumulate superseded versions run after run.
        sudo apt-get autoclean -y
        mkdir -p ~/apt-archives
        sudo cp -f /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
        echo "cached $(ls ~/apt-archives | wc -l) packages, $(du -sh ~/apt-archives | cut -f1)"
    # GLEDITOR_SDL is set explicitly rather than left to the Makefile's probe:
    # "whichever is installed" would silently make both jobs build the same
    # thing if a runner image ever gained the other one.
    - name: make
      run: make -j$(nproc) GLEDITOR_SDL=${{ matrix.sdl }} GLEDITOR_ENABLE_VULKAN=1
    # test/all rather than test: `make test` leaves the network suites out so
    # that the tests a person runs after every change stay quick, and the pull
    # request checks are where they are not left out.
    - name: make test
      run: make -j$(nproc) GLEDITOR_SDL=${{ matrix.sdl }} GLEDITOR_ENABLE_VULKAN=1 test/all
    # Render the sample document through each backend and require that they
    # agree. A backend that silently stops drawing still exits zero, so the
    # comparison -- not the exit code -- is what actually proves it works.
    - name: backend parity
      run: xvfb-run -s "-screen 0 1024x768x24" ./tools/compare-backends.sh
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe

  # The network path, with the two peers on separate network stacks. Its own
  # job because it needs root and packages the build jobs do not, and because a
  # flake in a network test should not be able to obscure whether the code
  # compiles.
  swarm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: install dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          libglm-dev libfreetype-dev libharfbuzz-dev \
          libfribidi-dev libunibreak-dev libfontconfig-dev \
          libsdl2-dev libsdl2-image-dev \
          libgl-dev libgmock-dev pkg-config \
          libtorrent-rasterbar-dev libssl-dev liblmdb-dev iproute2
    - name: build
      run: make -j$(nproc) GLEDITOR_SDL=2 xudu_test xudu-swarm-peer
    # Fails rather than skips if libtorrent went missing: this job exists to
    # exercise the swarm, so a silent skip would be the failure it is meant to
    # catch.
    - name: check the swarm was compiled in
      run: |
        ./build/xudu_test --gtest_filter=SwarmTest.* --gtest_list_tests > /dev/null
        pkg-config --exists libtorrent-rasterbar
    - name: swarm tests across network namespaces
      run: sudo tools/swarm-netns-test.sh
