name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: sdl3 ppa add
      run: sudo add-apt-repository ppa:hrzhu/sdl3-backport
    - name: update apt
      run: sudo apt-get update
    # PKGS in the Makefile is: pangomm-2.48 sdl3 sdl3-image gl glu glew.
    # SDL2 and spdlog are no longer used; sdl3-image is, and was missing.
    - name: packages
      run: >-
        sudo apt-get install -y
        libsdl3-dev libsdl3-image-dev
        libglm-dev libpangomm-2.48-dev
        libglew-dev libgl1-mesa-dev libglu1-mesa-dev
        libgmock-dev libgtest-dev
        clang libclang-rt-dev make
    - name: make
      run: make
    - name: make test
      run: make test
