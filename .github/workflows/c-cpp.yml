name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: sdl3 ppa add
      run: sudo add-apt-repository ppa:hrzhu/sdl3-backport
    - name: update apt
      run: sudo apt-get update
    # PKGS in the Makefile is: pangomm-2.48 sdl3 gl (+ vulkan when
    # GLEDITOR_ENABLE_VULKAN is set). SDL3_image is optional and is not in the
    # SDL3 backport PPA, so it is left out; the window icon is skipped without
    # it. The GL and GLES entry points are resolved
    # at runtime through SDL, so no GL library is linked; libgl-dev is still
    # needed for GL/glcorearb.h. mesa-vulkan-drivers provides lavapipe, a
    # software Vulkan device, and the validation layers catch API misuse that
    # would otherwise only show up as a blank window.
    - name: packages
      run: >-
        sudo apt-get install -y
        libsdl3-dev
        libglm-dev libpangomm-2.48-dev
        libgl-dev libgl1-mesa-dev libglu1-mesa-dev
        libvulkan-dev glslang-tools
        mesa-vulkan-drivers vulkan-validationlayers
        libgmock-dev libgtest-dev
        xvfb
        clang libclang-rt-dev make
    - name: make
      run: make GLEDITOR_ENABLE_VULKAN=1
    - name: make test
      run: make GLEDITOR_ENABLE_VULKAN=1 test
    # Render the sample document through each backend and require that they
    # agree. A backend that silently stops drawing still exits zero, so the
    # comparison -- not the exit code -- is what actually proves it works.
    - name: backend parity
      run: xvfb-run -s "-screen 0 1024x768x24" ./tools/compare-backends.sh
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
